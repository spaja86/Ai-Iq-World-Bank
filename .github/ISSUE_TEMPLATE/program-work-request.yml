name: Program work request
description: Propose developer + creator operating or business-structure work
labels: [enhancement]
body:
  - type: input
    id: objective
    attributes:
      label: Objective
      placeholder: What should be implemented?
    validations:
      required: true
  - type: dropdown
    id: lane
    attributes:
      label: Primary lane
      options:
        - Developer
        - Creator
        - Shared
    validations:
      required: true
  - type: textarea
    id: release_gate
    attributes:
      label: Release-gate impact
      description: Standards, document control, and sensitive-content checks required for completion.
    validations:
      required: true
